name: CI Pipeline

# Déclenche le pipeline à chaque push ou pull request
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ SAST avec Bandit
      - name: Run SAST (Bandit)
        run: |
          bandit -r .

      # 5️⃣ Lancer les tests unitaires
      - name: Run tests
        run: |
          pytest || true

      # 6️⃣ Optionnel : build Docker (plus tard)
      # - name: Build Docker image
      #   run: |
      #     docker build -t spacex-api:latest .
