name: CI/CD Pipeline

on:
  push:
    branches: [ main, feature/ci-cd-pipeline ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # --- SECTION SAST ---
      
      # 4️⃣ SAST : Scanner le code source avec Bandit
      - name: Run Bandit (Static Analysis)
        run: |
          # -r: récursif, -ll: seulement sévérité moyenne ou haute
          bandit -r . -ll -v

      # 5️⃣ SAST : Vérifier la sécurité des dépendances avec Safety
      - name: Run Safety (Dependency Check)
        run: |
          # Vérifie les vulnérabilités connues dans les packages installés
          safety check

      # --- FIN SECTION SAST ---

      # 6️⃣ Lancer les tests unitaires
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # On suppose que pytest est dans requirements.txt, sinon l'ajouter ici
          pytest

      # 7️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t spacex-api .

      # 8️⃣ Lancer container pour DAST
      - name: Run API container
        run: |
          docker run -d -p 8000:8000 --name spacex-api-test spacex-api
          sleep 5  # attendre que l'API démarre

      # 9️⃣ Lancer DAST
      - name: Run DAST
        run: |
          python dast_scan.py

      # 🔟 Arrêter et supprimer le container
      - name: Stop container
        run: |
          docker stop spacex-api-test
          docker rm spacex-api-test
