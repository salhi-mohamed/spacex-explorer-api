name: CI/CD Pipeline with Kubernetes
on:
  push:
    branches: [ main, feature/ci-cd-pipeline ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: spacex-api
  IMAGE_TAG: ${{ github.sha }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2️⃣ Installer Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      
      # 3️⃣ Installer les dépendances
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      # --- SECTION SAST ---
      
      # 4️⃣ SAST : Scanner le code source avec Bandit
      - name: Run Bandit (Static Analysis)
        run: |
          bandit -r . -ll -v
      
      # 5️⃣ SAST : Vérifier la sécurité des dépendances avec Safety
      - name: Run Safety (Dependency Check)
        run: |
          safety check
      
      # --- FIN SECTION SAST ---
      
      # 6️⃣ Lancer les tests unitaires
      - name: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest
      
      # 7️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      # 8️⃣ Build Docker image avec tag dynamique
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .
          docker tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      
      # 9️⃣ Lancer container pour DAST
      - name: Run API container
        run: |
          docker run -d -p 8000:8000 --name spacex-api-test ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          sleep 5
      
      # 🔟 Lancer DAST
      - name: Run DAST
        run: |
          python dast_scan.py
      
      # 1️⃣1️⃣ Arrêter et supprimer le container
      - name: Stop container
        run: |
          docker stop spacex-api-test
          docker rm spacex-api-test
      
      # 1️⃣2️⃣ Push vers Docker Hub (seulement sur main)
      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
      
      # 1️⃣3️⃣ Sauvegarder l'image Docker comme artefact
      - name: Save Docker image
        run: |
          docker save ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} | gzip > spacex-api.tar.gz
      
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: spacex-api.tar.gz
          retention-days: 1

  deploy-to-kubernetes:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # 1️⃣ Checkout code pour accéder aux manifests K8s
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 2️⃣ Télécharger l'image Docker
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
      
      # 3️⃣ Charger l'image Docker
      - name: Load Docker image
        run: |
          docker load < spacex-api.tar.gz
          docker tag ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} ${{ env.IMAGE_NAME }}:latest
      
      # 4️⃣ Installer Kind (Kubernetes in Docker)
      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
      
      # 5️⃣ Créer un cluster Kubernetes avec Kind
      - name: Create Kind cluster
        run: |
          kind create cluster --name spacex-cluster --config - <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30000
              hostPort: 8000
              protocol: TCP
          EOF
          kubectl cluster-info --context kind-spacex-cluster
      
      # 6️⃣ Charger l'image Docker dans Kind
      - name: Load image to Kind
        run: |
          kind load docker-image ${{ env.IMAGE_NAME }}:latest --name spacex-cluster
      
      # 7️⃣ Mettre à jour le manifest de déploiement
      - name: Update deployment manifest
        run: |
          sed -i "s|image: spacex-api:1.0|image: ${{ env.IMAGE_NAME }}:latest|g" k8s/deployment.yaml
          sed -i "s|imagePullPolicy: Never|imagePullPolicy: IfNotPresent|g" k8s/deployment.yaml
      
      # 8️⃣ Mettre à jour le service pour utiliser NodePort
      - name: Update service manifest
        run: |
          sed -i 's|type: NodePort|type: NodePort|g' k8s/service.yaml
          # Ajouter nodePort si pas présent
          if ! grep -q "nodePort:" k8s/service.yaml; then
            sed -i '/targetPort: 8000/a\      nodePort: 30000' k8s/service.yaml
          fi
      
      # 9️⃣ Déployer sur Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
      
      # 🔟 Attendre que le déploiement soit prêt
      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/spacex-api --timeout=300s
      
      # 1️⃣1️⃣ Vérifier le statut du déploiement
      - name: Check deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -l app=spacex-api
          echo "=== Services ==="
          kubectl get svc spacex-api-service
          echo "=== Deployment ==="
          kubectl get deployment spacex-api
      
      # 1️⃣2️⃣ Test de santé de l'API déployée
      - name: Health check
        run: |
          echo "Waiting for service to be ready..."
          sleep 15
          
          # Tester via le NodePort
          curl -v http://localhost:8000/ || echo "API endpoint test"
          
          # Afficher les logs du pod
          POD_NAME=$(kubectl get pods -l app=spacex-api -o jsonpath='{.items[0].metadata.name}')
          echo "=== Pod logs ==="
          kubectl logs $POD_NAME
      
      # 1️⃣3️⃣ Valider les manifests K8s
      - name: Validate Kubernetes manifests
        run: |
          kubectl get all -l app=spacex-api
          echo "✅ Deployment successful!"
          echo "🐳 Image disponible sur Docker Hub: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
      
      # 1️⃣4️⃣ Afficher les logs en cas d'échec
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Pod description ==="
          kubectl describe pods -l app=spacex-api
          echo "=== Pod logs ==="
          kubectl logs -l app=spacex-api --tail=100
          echo "=== Events ==="
          kubectl get events --sort-by='.lastTimestamp'